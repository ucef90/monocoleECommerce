services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - '8787:8787'
    environment:
      PORT: 8787
      DB_CLIENT: sqlite
      DB_PATH: /app/backend/data/monocle.sqlite
      STATIC_DIR: /app
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: admin123
      ADMIN_SESSION_SECRET: change-me-in-compose
      ADMIN_SESSION_HOURS: 12
      DAILY_SLOT_TOTAL: 12
      DAILY_SLOT_MIN: 4
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8787/api/health | grep -q '\"ok\":true'"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s
    volumes:
      - monocle_sqlite_data:/app/backend/data

volumes:
  monocle_sqlite_data:
